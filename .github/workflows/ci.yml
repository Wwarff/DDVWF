name: DDVWF CI
on:
  push:
    branches: [ main, integration/complete-zone-ir ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore DDVWF.slnx
      - run: dotnet build DDVWF.slnx -c Release --no-restore
      - run: dotnet test DDVWF.slnx -c Release --no-build
      - name: Verify DDVWF UI semantic contracts
        shell: pwsh
        run: |
          $xaml = Get-Content -Raw "src/DDVWF.App/MainWindow.xaml"
          $code = Get-Content -Raw "src/DDVWF.App/MainWindow.xaml.cs"
          if ($xaml -notmatch 'x:Name="Glyph"[^>]+Foreground="\{DynamicResource ToolBarTextBrush\}"') { throw "Toolbar glyph is not directly bound to ToolBarTextBrush." }
          if ($xaml -notmatch 'x:Key="\{x:Static ToolBar.ButtonStyleKey\}"') { throw "DDVWF toolbar style is not wired through ToolBar.ButtonStyleKey." }
          if ($xaml -notmatch 'TargetName="Glyph" Property="Foreground" Value="\{DynamicResource ToolBarDisabledTextBrush\}"') { throw "Disabled toolbar glyph is not directly bound to ToolBarDisabledTextBrush." }
          if ($xaml -notmatch 'ToolBarDisabledTextBrush') { throw "Toolbar disabled text semantic brush is not wired." }
          if ($xaml -match '<GridSplitter[^>]+BottomSplitter_Drag') { throw "Bottom workspace regressed to WPF GridSplitter behavior." }
          $thumbs = [regex]::Matches($xaml,'<Thumb[^>]+Grid.Column="(?:1|3|5)"[^>]+DragDelta="BottomSplitter_DragDelta"').Count
          if ($thumbs -ne 3) { throw "Expected three deterministic bottom pane dividers for Status, Diagnostics, Native Data, and Inspector; found $thumbs." }
          if ($xaml -match 'Text="Difference"' -or $xaml -match 'Text="Changes"' -or $xaml -match 'Text="Console"') { throw "Removed Difference/Changes/Console panes returned." }
          if ($xaml -notmatch 'x:Name="AssetSearchBox"') { throw "Unified active-zone asset search is missing." }
          if ($xaml -match 'Header="MODEL VIEWER"') { throw "Preview surface regressed to a redundant Model Viewer header." }
          if ($code -notmatch 'AdjacentPaneResize\.Apply') { throw "Bottom divider does not use tested adjacent-pair resize math." }
          $renderer = Get-Content -Raw "src/DDVWF.App/Renderer/babylon.html"
          if ($renderer -notmatch 'camera\.angularSensibility=1000') { throw "Accepted RMB camera sensitivity regressed." }
          if ($renderer -notmatch 'if\(arrowLeft\)camera\.rotation\.y-=1\.35\*dt' -or $renderer -notmatch 'if\(arrowRight\)camera\.rotation\.y\+=1\.35\*dt' -or $renderer -notmatch "type:'heading',yaw:camera.rotation.y") { throw "Keyboard yaw/compass heading contract regressed." }
      - run: dotnet publish src/DDVWF.App/DDVWF.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/DDVWF
      - name: Vendor pinned Babylon 7.2.1 for renderer smoke
        shell: pwsh
        run: |
          npm install --prefix .renderer-deps babylonjs@7.2.1 --no-save
          $source = Join-Path $PWD ".renderer-deps/node_modules/babylonjs/babylon.js"
          if (!(Test-Path -LiteralPath $source)) { throw "Pinned Babylon runtime was not produced for renderer smoke." }
          New-Item -ItemType Directory -Force -Path "artifacts/DDVWF/Renderer" | Out-Null
          Copy-Item -LiteralPath $source -Destination "artifacts/DDVWF/Renderer/babylon.js"
      - name: Capture DDVWF UI smoke visual
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DDVWF_UI_SMOKE = "1"
          $exe = Join-Path $PWD "artifacts/DDVWF/DragonDenVisualWorldForge.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $out = Join-Path $PWD "artifacts/DDVWF-UI-smoke.png"
          $bmp.Save($out,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (!(Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "UI smoke screenshot was not captured." }
          $env:DDVWF_UI_SMOKE = $null
          $env:DDVWF_THEME_SMOKE = "1"
          $themeProcess = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $themeBmp = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $themeGraphics = [System.Drawing.Graphics]::FromImage($themeBmp)
          $themeGraphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $themeOut = Join-Path $PWD "artifacts/DDVWF-ThemeEditor-smoke.png"
          $themeBmp.Save($themeOut,[System.Drawing.Imaging.ImageFormat]::Png)
          $themeGraphics.Dispose(); $themeBmp.Dispose()
          Stop-Process -Id $themeProcess.Id -Force -ErrorAction SilentlyContinue
          if (!(Test-Path $themeOut) -or (Get-Item $themeOut).Length -lt 1000) { throw "Theme Editor smoke screenshot was not captured." }
          $env:DDVWF_THEME_SMOKE = $null
          $env:DDVWF_COMPASS_SMOKE = "1"
          $compassProcess = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $compassBmp = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $compassGraphics = [System.Drawing.Graphics]::FromImage($compassBmp)
          $compassGraphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $compassOut = Join-Path $PWD "artifacts/DDVWF-Compass-smoke.png"
          $compassBmp.Save($compassOut,[System.Drawing.Imaging.ImageFormat]::Png)
          $compassGraphics.Dispose(); $compassBmp.Dispose()
          Stop-Process -Id $compassProcess.Id -Force -ErrorAction SilentlyContinue
          if (!(Test-Path $compassOut) -or (Get-Item $compassOut).Length -lt 1000) { throw "Compass smoke screenshot was not captured." }
          $env:DDVWF_COMPASS_SMOKE = $null
          $env:DDVWF_SHORTCUTS_SMOKE = "1"
          $shortcutsProcess = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $shortcutsBmp = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $shortcutsGraphics = [System.Drawing.Graphics]::FromImage($shortcutsBmp)
          $shortcutsGraphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $shortcutsOut = Join-Path $PWD "artifacts/DDVWF-Shortcuts-smoke.png"
          $shortcutsBmp.Save($shortcutsOut,[System.Drawing.Imaging.ImageFormat]::Png)
          $shortcutsGraphics.Dispose(); $shortcutsBmp.Dispose()
          Stop-Process -Id $shortcutsProcess.Id -Force -ErrorAction SilentlyContinue
          if (!(Test-Path $shortcutsOut) -or (Get-Item $shortcutsOut).Length -lt 1000) { throw "Shortcuts smoke screenshot was not captured." }
          $env:DDVWF_SHORTCUTS_SMOKE = $null
          $diag = Get-Content -Raw "artifacts/DDVWF/DDVWF-UI-DIAGNOSTICS.txt"
          if ($diag -notmatch 'TextBlock text=Select fg=#FFFFFF00') { throw "Rendered toolbar Select glyph did not resolve the yellow sentinel theme color." }
      - name: Verify Babylon geometry framebuffer
        shell: pwsh
        run: |
          $env:DDVWF_RENDERER_SMOKE = "1"
          $exe = Join-Path $PWD "artifacts/DDVWF/DragonDenVisualWorldForge.exe"
          $rendererProcess = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            $rendererDiagPath = "artifacts/DDVWF/DDVWF-RENDERER-DIAGNOSTICS.json"
            $pixelPath = "artifacts/DDVWF/DDVWF-RENDERER-PIXEL.json"
            while ([DateTime]::UtcNow -lt $deadline -and (!(Test-Path $rendererDiagPath) -or !(Test-Path $pixelPath))) { Start-Sleep -Milliseconds 250 }
            if (!(Test-Path $rendererDiagPath)) { throw "Renderer smoke did not produce renderer diagnostics." }
            if (!(Test-Path $pixelPath)) { throw "Renderer smoke did not produce framebuffer evidence." }
            $rendererDiag = Get-Content -Raw $rendererDiagPath | ConvertFrom-Json
            if ($rendererDiag.boundsFailed -or $rendererDiag.vertices -lt 8 -or $rendererDiag.visible -lt 1 -or $rendererDiag.validBounds -lt 1) { throw "Renderer smoke did not create visible, bounded geometry: $($rendererDiag | ConvertTo-Json -Compress)" }
            $pixel = Get-Content -Raw $pixelPath | ConvertFrom-Json
            if ($pixel.width -lt 16 -or $pixel.height -lt 16) { throw "Renderer framebuffer has invalid dimensions: $($pixel | ConvertTo-Json -Compress)" }
            $clear = @(8,10,13)
            $nonBackground = @($pixel.samples | Where-Object { ([Math]::Abs([int]$_[0]-$clear[0])+[Math]::Abs([int]$_[1]-$clear[1])+[Math]::Abs([int]$_[2]-$clear[2])) -ge 18 }).Count
            if ($nonBackground -lt 1) { throw "Renderer framebuffer samples are all effectively the clear/background color: $($pixel | ConvertTo-Json -Compress)" }
          } finally {
            Stop-Process -Id $rendererProcess.Id -Force -ErrorAction SilentlyContinue
            $env:DDVWF_RENDERER_SMOKE = $null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DDVWF-UI-smoke
          path: |
            artifacts/DDVWF-UI-smoke.png
            artifacts/DDVWF-ThemeEditor-smoke.png
            artifacts/DDVWF-Compass-smoke.png
            artifacts/DDVWF-Shortcuts-smoke.png
            artifacts/DDVWF-Renderer-smoke.png
            artifacts/DDVWF/DDVWF-UI-DIAGNOSTICS.txt
            artifacts/DDVWF/DDVWF-RENDERER-DIAGNOSTICS.json
            artifacts/DDVWF/DDVWF-RENDERER-PIXEL.json
      - name: Vendor pinned Babylon 7.2.1
        shell: pwsh
        run: |
          npm install --prefix .renderer-deps babylonjs@7.2.1 --no-save
          $source = Join-Path $PWD ".renderer-deps/node_modules/babylonjs/babylon.js"
          if (!(Test-Path -LiteralPath $source)) { throw "Pinned Babylon runtime was not produced." }
          New-Item -ItemType Directory -Force -Path "artifacts/DDVWF/Renderer" | Out-Null
          Copy-Item -LiteralPath $source -Destination "artifacts/DDVWF/Renderer/babylon.js"
      - name: Write build identity
        shell: pwsh
        run: |
          @"
          DDVWF TEST BUILD
          Commit: $env:GITHUB_SHA
          Branch: $env:GITHUB_REF_NAME
          Workflow run: $env:GITHUB_RUN_ID
          Workflow number: $env:GITHUB_RUN_NUMBER
          Built UTC: $([DateTime]::UtcNow.ToString("o"))
          "@ | Set-Content -LiteralPath "artifacts/DDVWF/DDVWF-BUILD-IDENTITY.txt" -Encoding utf8

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/DDVWF/*" -DestinationPath "artifacts/DDVWF-Latest-Test-win-x64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: DDVWF-win-x64
          path: artifacts/DDVWF

      - name: Publish immutable test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/complete-zone-ir'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "DDVWF-Test-$env:GITHUB_RUN_NUMBER"
          $asset = "artifacts/DDVWF-Latest-Test-win-x64.zip"
          $notes = "DDVWF test build from integration/complete-zone-ir.`n`nCommit: $env:GITHUB_SHA`nWorkflow run: $env:GITHUB_RUN_ID"
          gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DDVWF Test $env:GITHUB_RUN_NUMBER" --notes $notes --prerelease
