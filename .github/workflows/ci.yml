name: DDVWF CI
on:
  push:
    branches: [ main, integration/complete-zone-ir ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore DDVWF.slnx
      - run: dotnet build DDVWF.slnx -c Release --no-restore
      - run: dotnet test DDVWF.slnx -c Release --no-build
