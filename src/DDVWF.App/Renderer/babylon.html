<!doctype html><html><head><meta charset="utf-8"><style>html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#080a0d}canvas{outline:none}</style><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true}),scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.03,.04,.05,1);const camera=new BABYLON.UniversalCamera('camera',new BABYLON.Vector3(0,10,-20),scene);camera.attachControl(canvas,true);camera.speed=1;camera.angularSensibility=500;camera.keysUp=[87,38];camera.keysDown=[83,40];camera.keysLeft=[65,37];camera.keysRight=[68,39];
new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,0),scene);const gizmos=new BABYLON.GizmoManager(scene);gizmos.usePointerToAttachGizmos=false;let byId=new Map(),selected=null,mode='select';
function notify(o){window.chrome?.webview?.postMessage(JSON.stringify(o))}
function setMode(m){mode=m;gizmos.positionGizmoEnabled=m==='move';gizmos.rotationGizmoEnabled=m==='rotate';gizmos.scaleGizmoEnabled=m==='scale';gizmos.attachToNode(m==='select'?null:selected)}
function select(root){if(selected)selected.getChildMeshes().forEach(m=>m.showBoundingBox=false);selected=root||null;if(selected)selected.getChildMeshes().forEach(m=>m.showBoundingBox=true);gizmos.attachToNode(mode==='select'?null:selected)}
function loadScene(payload){for(const r of byId.values())r.dispose();byId.clear();selected=null;gizmos.attachToNode(null);const d=JSON.parse(payload);for(const e of d.meshes){const root=new BABYLON.TransformNode(e.name,scene);root.position=new BABYLON.Vector3(e.position.x,e.position.z,e.position.y);root.rotation.y=e.position.heading*Math.PI/180;root.scaling.setAll(e.scale);root.metadata={ddvwf:true,id:e.id};for(const p of e.asset.primitives){const mesh=new BABYLON.Mesh(e.name+' '+p.name,scene),vd=new BABYLON.VertexData();vd.positions=p.vertices.flatMap(v=>[v.position.x,v.position.y,v.position.z]);vd.normals=p.vertices.flatMap(v=>[v.normal.x,v.normal.y,v.normal.z]);vd.uvs=p.vertices.flatMap(v=>[v.uv.x,v.uv.y]);vd.indices=p.indices;vd.applyToMesh(mesh);mesh.scaling.x=e.asset.flipRootX?-1:1;mesh.parent=root;mesh.metadata={ddvwf:true,id:e.id,root};}byId.set(e.id,root);}}
function commit(){if(!selected)return;notify({type:'transform',id:selected.metadata.id,x:selected.position.x,y:selected.position.z,z:selected.position.y,heading:selected.rotation.y*180/Math.PI,scale:selected.scaling.y})}
function focus(){if(!selected)return;const b=selected.getHierarchyBoundingVectors(true),center=b.min.add(b.max).scale(.5),radius=Math.max(1,b.max.subtract(b.min).length());camera.position=center.add(new BABYLON.Vector3(0,radius*.3,-radius*1.2));camera.setTarget(center)}
function remove(id){const r=byId.get(id);if(!r)return;if(selected===r)select(null);r.dispose();byId.delete(id)}
scene.onPointerObservable.add(pi=>{if(pi.type!==BABYLON.PointerEventTypes.POINTERPICK)return;const root=pi.pickInfo?.pickedMesh?.metadata?.root;if(root){select(root);notify({type:'select',id:root.metadata.id})}});
scene.onKeyboardObservable.add(k=>{if(k.type===BABYLON.KeyboardEventTypes.KEYUP&&k.event.key.toLowerCase()==='f')focus()});
engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());setInterval(()=>notify({type:'camera',x:camera.position.x,y:camera.position.z,z:camera.position.y}),100);
window.ddvwf={loadScene,setMode,focus,remove,selectId:id=>select(byId.get(id)||null),commit};
</script></body></html>
