<!doctype html><html><head><meta charset="utf-8"><style>html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#080a0d}canvas{outline:none}</style><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true}),scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.03,.04,.05,1);const camera=new BABYLON.UniversalCamera('camera',new BABYLON.Vector3(0,10,-20),scene);camera.attachControl(canvas,true);camera.speed=1;camera.angularSensibility=500;camera.keysUp=[87,38];camera.keysDown=[83,40];camera.keysLeft=[65,37];camera.keysRight=[68,39];
new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,0),scene);let byId=new Map(),selected=null;
function loadScene(payload){for(const m of [...scene.meshes])if(m.metadata?.ddvwf)m.dispose();byId.clear();const d=JSON.parse(payload);for(const e of d.meshes){for(const p of e.asset.primitives){const mesh=new BABYLON.Mesh(e.name+' '+p.name,scene),vd=new BABYLON.VertexData();vd.positions=p.vertices.flatMap(v=>[v.position.x,v.position.y,v.position.z]);vd.normals=p.vertices.flatMap(v=>[v.normal.x,v.normal.y,v.normal.z]);vd.uvs=p.vertices.flatMap(v=>[v.uv.x,v.uv.y]);vd.indices=p.indices;vd.applyToMesh(mesh);mesh.scaling=new BABYLON.Vector3((e.asset.flipRootX?-1:1)*e.scale,e.scale,e.scale);mesh.position=new BABYLON.Vector3(e.position.x,e.position.z,e.position.y);mesh.metadata={ddvwf:true,id:e.id};byId.set(e.id,mesh);}}}
scene.onPointerObservable.add(pi=>{if(pi.type===BABYLON.PointerEventTypes.POINTERPICK&&pi.pickInfo?.pickedMesh?.metadata?.id){if(selected)selected.showBoundingBox=false;selected=pi.pickInfo.pickedMesh;selected.showBoundingBox=true;chrome.webview.postMessage(JSON.stringify({type:'select',id:selected.metadata.id}));}});
engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());window.ddvwf={loadScene};
</script></body></html>
