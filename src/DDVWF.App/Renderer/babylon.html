<!doctype html><html><head><meta charset="utf-8"><style>html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#080a0d}canvas{outline:none}</style><script src="babylon.js"></script></head><body><canvas id="c"></canvas><script>
if(typeof BABYLON==='undefined')throw new Error('Babylon runtime unavailable. DDVWF requires its pinned renderer runtime.');const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true}),scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.03,.04,.05,1);const camera=new BABYLON.UniversalCamera('camera',new BABYLON.Vector3(0,10,-20),scene);camera.attachControl(canvas,true);if(camera.inputs?.attached?.mouse)camera.inputs.attached.mouse.buttons=[2];camera.speed=20;camera.angularSensibility=166.6667;camera.keysUp=[87,38];camera.keysDown=[83,40];camera.keysLeft=[65,37];camera.keysRight=[68,39];camera.keysUpward=[69,33];camera.keysDownward=[81,34];
new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,0),scene);const gizmos=new BABYLON.GizmoManager(scene);gizmos.usePointerToAttachGizmos=false;let byId=new Map(),selected=null,mode='select',sceneTimers=[],loadedMaterials=[],loadedSkeletons=[];
function notify(o){window.chrome?.webview?.postMessage(JSON.stringify(o))}
function setMode(m){mode=m;gizmos.positionGizmoEnabled=m==='move';gizmos.rotationGizmoEnabled=m==='rotate';gizmos.scaleGizmoEnabled=m==='scale';gizmos.attachToNode(m==='select'?null:selected)}
function select(root){if(selected)selected.getChildMeshes().forEach(m=>m.showBoundingBox=false);selected=root||null;if(selected)selected.getChildMeshes().forEach(m=>m.showBoundingBox=true);gizmos.attachToNode(mode==='select'?null:selected)}
function loadScene(payload){for(const t of sceneTimers)clearInterval(t);sceneTimers=[];for(const r of byId.values())r.dispose();byId.clear();for(const m of loadedMaterials)m.dispose(true,true);loadedMaterials=[];for(const s of loadedSkeletons)s.dispose();loadedSkeletons=[];selected=null;gizmos.attachToNode(null);const d=JSON.parse(payload);for(const e of d.meshes){const root=new BABYLON.TransformNode(e.name,scene);root.position=new BABYLON.Vector3(e.position.x,e.position.z,e.position.y);root.rotation.y=e.position.heading*Math.PI/180;root.scaling.setAll(e.scale);root.metadata={ddvwf:true,id:e.id};let skeleton=null;if(e.asset.skeleton?.bones?.length){skeleton=new BABYLON.Skeleton(e.name+' skeleton',e.id,scene);loadedSkeletons.push(skeleton);const bones=[];e.asset.skeleton.bones.forEach((b,i)=>{const parent=b.parentIndex>=0?bones[b.parentIndex]:null;const matrix=BABYLON.Matrix.Compose(new BABYLON.Vector3(b.scale,b.scale,b.scale),new BABYLON.Quaternion(b.rotation.x,b.rotation.y,b.rotation.z,b.rotation.w),new BABYLON.Vector3(b.translation.x,b.translation.y,b.translation.z));bones.push(new BABYLON.Bone(b.name,skeleton,parent,matrix,null,null,i));});}for(const p of e.asset.primitives){const mesh=new BABYLON.Mesh(e.name+' '+p.name,scene),vd=new BABYLON.VertexData();vd.positions=p.vertices.flatMap(v=>[v.position.x,v.position.y,v.position.z]);vd.normals=p.vertices.flatMap(v=>[v.normal.x,v.normal.y,v.normal.z]);vd.uvs=p.vertices.flatMap(v=>[v.uv.x,v.uv.y]);vd.indices=p.indices;if(skeleton){vd.matricesIndices=p.vertices.flatMap(v=>[v.boneIndex,0,0,0]);vd.matricesWeights=p.vertices.flatMap(v=>[1,0,0,0]);}vd.applyToMesh(mesh);if(skeleton)mesh.skeleton=skeleton;if(p.morphFrames?.length){const manager=new BABYLON.MorphTargetManager(scene);mesh.morphTargetManager=manager;p.morphFrames.forEach((frame,i)=>{const target=new BABYLON.MorphTarget('frame '+i,0,scene);const pos=[];for(let vi=0;vi<p.vertices.length;vi++){const b=p.vertices[vi].position,d=frame.positionDeltas[vi];pos.push(b.x+d.x,b.y+d.y,b.z+d.z)}target.setPositions(pos);manager.addTarget(target)});let fi=0;const delay=Math.max(1,p.morphFrames[0].delayMs);sceneTimers.push(setInterval(()=>{for(let i=0;i<manager.numTargets;i++)manager.getTarget(i).influence=i===fi?1:0;fi=(fi+1)%manager.numTargets},delay));}if(p.material){const mat=new BABYLON.StandardMaterial('mat '+p.material.name+' '+e.id,scene);loadedMaterials.push(mat);mat.backFaceCulling=!p.passThrough;mat.alpha=p.material.alpha??1;if(p.material.alphaTest)mat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;if(p.material.additive)mat.alphaMode=BABYLON.Engine.ALPHA_ADD;if(p.material.unlit)mat.disableLighting=true;const raw=d.textures?.[p.material.textureName];if(raw){const makeTex=n=>{const b=d.textures?.[n];if(!b)return null;const lower=(n||'').toLowerCase();const ext=lower.endsWith('.png')?'image/png':lower.endsWith('.dds')?'image/vnd-ms.dds':'image/bmp';return new BABYLON.Texture('data:'+ext+';base64,'+b,scene,false,false)};mat.diffuseTexture=makeTex(p.material.textureName);const frames=p.material.textureFrames||[];if(frames.length>1&&p.material.animationDelayMs>0){let fi=0;sceneTimers.push(setInterval(()=>{fi=(fi+1)%frames.length;const t=makeTex(frames[fi]);if(t){const old=mat.diffuseTexture;mat.diffuseTexture=t;old?.dispose();}},p.material.animationDelayMs));}}mesh.material=mat;}mesh.scaling.x=e.asset.flipRootX?-1:1;mesh.parent=root;mesh.metadata={ddvwf:true,id:e.id,root};}byId.set(e.id,root);}for(const e of d.markers||[]){const root=new BABYLON.TransformNode(e.name,scene);root.position=new BABYLON.Vector3(e.position.x,e.position.z,e.position.y);root.rotation.y=e.position.heading*Math.PI/180;root.scaling.setAll(e.scale||1);root.metadata={ddvwf:true,id:e.id};const marker=e.kind==='Door'?BABYLON.MeshBuilder.CreateBox(e.name,{size:2},scene):BABYLON.MeshBuilder.CreateSphere(e.name,{diameter:1.5},scene);marker.parent=root;marker.metadata={ddvwf:true,id:e.id,root};byId.set(e.id,root);}}
function commit(){if(!selected)return;notify({type:'transform',id:selected.metadata.id,x:selected.position.x,y:selected.position.z,z:selected.position.y,heading:selected.rotation.y*180/Math.PI,scale:selected.scaling.y})}
function focus(){if(!selected)return;const b=selected.getHierarchyBoundingVectors(true),center=b.min.add(b.max).scale(.5),radius=Math.max(1,b.max.subtract(b.min).length());camera.position=center.add(new BABYLON.Vector3(0,radius*.3,-radius*1.2));camera.setTarget(center)}
function remove(id){const r=byId.get(id);if(!r)return;if(selected===r)select(null);r.dispose();byId.delete(id)}
scene.onPointerObservable.add(pi=>{if(pi.type!==BABYLON.PointerEventTypes.POINTERPICK)return;const root=pi.pickInfo?.pickedMesh?.metadata?.root;if(root){select(root);notify({type:'select',id:root.metadata.id})}});
scene.onKeyboardObservable.add(k=>{if(k.type===BABYLON.KeyboardEventTypes.KEYUP&&k.event.key.toLowerCase()==='f')focus()});canvas.addEventListener('pointerup',()=>{if(mode!=='select')commit()});
canvas.addEventListener('wheel',e=>{camera.speed=Math.max(.25,Math.min(500,camera.speed*(e.deltaY<0?1.15:.87)));notify({type:'cameraSpeed',speed:camera.speed})},{passive:true});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());setInterval(()=>notify({type:'camera',x:camera.position.x,y:camera.position.z,z:camera.position.y,yaw:camera.rotation.y,pitch:camera.rotation.x,speed:camera.speed}),100);
function setCamera(c){camera.position.set(c.x,c.z,c.y);camera.rotation.x=c.pitch||0;camera.rotation.y=c.yaw||0;camera.speed=c.speed||20}window.ddvwf={loadScene,setMode,focus,remove,selectId:id=>select(byId.get(id)||null),commit,setCamera};
</script></body></html>
